# docker-compose.yml
name: underpeaks-core
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: underpeaks
      POSTGRES_PASSWORD: ${DB_PASSWORD:-underpeaks_local}
      POSTGRES_DB: underpeaks
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underpeaks"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      additional_contexts:
        shared: ../shared_models
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/data

volumes:
  dbdata:
  appdata: